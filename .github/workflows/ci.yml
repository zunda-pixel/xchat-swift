name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The Swift 6.4 toolchain, which swift-tools-version 6.4 requires; the
    # setup-swift action's release list has no 6.4 entry yet.
    container: swiftlang/swift:nightly-6.4.x-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test
