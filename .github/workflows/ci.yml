name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # The Swift 6.4 toolchain, which swift-tools-version 6.4 requires; the
    # setup-swift action's release list has no 6.4 entry yet.
    container: swiftlang/swift:nightly-6.4.x-jammy@sha256:96b2c94a0743700be6e3a7ccd58d8e99b04e09be6d2729f3cb5ad1d0fd1ae7fa
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install libsodium headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsodium-dev pkg-config
      # swift-sodium emits a preprocessor warning for system libsodium (#3).
      - run: swift test -Xcc -Wno-cpp
